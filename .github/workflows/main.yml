name: "Build and Push Container"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Makes the repository available to the action
      - uses: actions/checkout@v7
      
      # Log in to GHCR
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Install Nix
      - uses: cachix/install-nix-action@v31

      # Build the container
      - run: |
          nix build .#docker

      # Load the container, tag it, and push it
      - run: |
          docker tag "$IMAGE" ghcr.io/${REPO,,}:latest
          docker push ghcr.IMAGEo/${REPO,,}:latest
        env:
          IMAGE: '$(docker load < result | sed "s/Loaded image: //")'
          REPO: '${{ github.repository}}'